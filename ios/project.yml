name: ScreenCP
options:
  bundleIdPrefix: com.vishnukchitti
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    DEVELOPMENT_TEAM: R78VP2V5AQ
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"
targets:
  ScreenCP:
    type: application
    platform: iOS
    sources:
      - ScreenCP/Sources
      - ScreenCP/Shared
      - ScreenCP/Resources
    dependencies:
      - target: ScreenCPMonitor
      - target: ScreenCPApplier
      - target: ScreenCPShield
      - target: ScreenCPShieldAction
      - target: ScreenCPWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vishnukchitti.screencp
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_ENTITLEMENTS: ScreenCP/ScreenCP.entitlements
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: ScreenCP/Info.plist
      properties:
        UIBackgroundModes: [remote-notification]
        NSSupportsLiveActivities: true
  ScreenCPApplier:
    type: app-extension
    platform: iOS
    sources:
      - ScreenCPApplier/Sources
      - ScreenCP/Shared
      - ScreenCP/Sources/Secrets.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vishnukchitti.screencp.applier
        CODE_SIGN_ENTITLEMENTS: ScreenCPApplier/ScreenCPApplier.entitlements
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: ScreenCPApplier/Info.plist
      properties:
        CFBundleVersion: "1"
        CFBundleShortVersionString: "0.1.0"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
  ScreenCPWidgets:
    type: app-extension
    platform: iOS
    sources:
      - ScreenCPWidgets/Sources
      - ScreenCP/Shared/GrantActivityAttributes.swift
    settings:
      base:
        IPHONEOS_DEPLOYMENT_TARGET: "16.2"
        PRODUCT_BUNDLE_IDENTIFIER: com.vishnukchitti.screencp.widgets
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: "1"
        CFBundleShortVersionString: "0.1.0"
    info:
      path: ScreenCPWidgets/Info.plist
      properties:
        CFBundleVersion: "1"
        CFBundleShortVersionString: "0.1.0"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  ScreenCPShieldAction:
    type: app-extension
    platform: iOS
    sources:
      - ScreenCPShieldAction/Sources
      - ScreenCP/Shared
      - ScreenCP/Sources/Secrets.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vishnukchitti.screencp.shieldaction
        CODE_SIGN_ENTITLEMENTS: ScreenCPShieldAction/ScreenCPShieldAction.entitlements
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: ScreenCPShieldAction/Info.plist
      properties:
        CFBundleVersion: "1"
        CFBundleShortVersionString: "0.1.0"
        NSExtension:
          # NOT ManagedSettingsUI — the action service lives under ManagedSettings
          # (verified against Xcode's own Shield Action Extension template).
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionHandler
  ScreenCPShield:
    type: app-extension
    platform: iOS
    sources:
      - ScreenCPShield/Sources
      - ScreenCP/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vishnukchitti.screencp.shield
        CODE_SIGN_ENTITLEMENTS: ScreenCPShield/ScreenCPShield.entitlements
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: ScreenCPShield/Info.plist
      properties:
        CFBundleVersion: "1"
        CFBundleShortVersionString: "0.1.0"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldDataSource
  ScreenCPMonitor:
    type: app-extension
    platform: iOS
    sources:
      - ScreenCPMonitor/Sources
      - ScreenCP/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vishnukchitti.screencp.monitor
        CODE_SIGN_ENTITLEMENTS: ScreenCPMonitor/ScreenCPMonitor.entitlements
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: ScreenCPMonitor/Info.plist
      properties:
        CFBundleVersion: "1"
        CFBundleShortVersionString: "0.1.0"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MonitorExtension
